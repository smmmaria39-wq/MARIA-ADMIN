<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SMMMARIA Panel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Imports -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/typography.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/buttons.css">
    <link rel="stylesheet" href="assets/css/forms.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth__header">
                <a href="login.html" class="auth__logo">SMM<span class="text-gold">MARIA</span> <span class="text-muted text-sm">Admin</span></a>
                <h2 class="auth__title">Secure Sign In</h2>
                <p class="auth__subtitle">Enter your credentials to access the dashboard</p>
            </div>
            
            <form class="auth__form" id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="admin@smmmaria.com" required>
                </div>
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                        <a href="#" class="form-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="input-action" aria-label="Toggle Password Visibility">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" class="form-checkbox">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-label">Remember this device</span>
                    </label>
                </div>

                <button type="submit" class="btn btn--primary btn--block">Sign In to Dashboard</button>
            </form>
        </div>
    </div>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
